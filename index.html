<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Spirit of the Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: one narrow column, phone-first. Single dark theme: black night with Caribbean turquoise + deep-sea blue glow. */
:root{
  --bg:#030607; --surface:#0a1517; --ink:#e6f7f5; --muted:#86aeb0; --line:#173036;
  --accent:#19d3c0; --accent-ink:#021513; --sea:#2f8fff; --lagoon:#0fae7a;
  --yes:#4be39a; --yes-bg:#0b2e20; --no:#ff7b72; --no-bg:#33100f; --warn:#f2c35b; --warn-bg:#2e240c;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 0% 0%, color-mix(in srgb, var(--sea) 22%, transparent), transparent 60%),
  radial-gradient(100% 50% at 100% 0%, color-mix(in srgb, var(--lagoon) 20%, transparent), transparent 60%), var(--bg);
  background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,48px);line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere;
  background:linear-gradient(90deg,var(--accent),var(--sea));-webkit-background-clip:text;background-clip:text;color:transparent}
.tab[aria-selected="true"]{background:linear-gradient(90deg,var(--accent),var(--sea))!important}
.count{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.count small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.count b{color:var(--accent)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.search{position:relative}
.search input{width:100%;box-sizing:border-box;font-size:24px;font-weight:600;padding:18px 56px 18px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:22px;cursor:pointer}

.verdict{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.verdict .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;text-transform:uppercase}
.verdict.yes{background:var(--yes-bg);color:var(--yes)}
.verdict.no{background:var(--no-bg);color:var(--no)}
.verdict.maybe{background:var(--warn-bg);color:var(--warn)}
.verdict.idle{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.verdict .sub{font-size:14px;font-weight:500}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{flex:1;min-width:0}
.row .name{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:3px}
.chip.in{background:var(--yes-bg);color:var(--yes)}
.chip.out{background:var(--bg);color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:14px;color:var(--muted);margin-top:4px}
.row{flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-left:auto}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:var(--no-bg);color:var(--no)}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel label{font-weight:600}
.panel .hint{font-size:14px;color:var(--muted);margin:0}
textarea{width:100%;box-sizing:border-box;min-height:160px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical;line-height:1.5}
.field{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sectionhead h2{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0}
.muted{color:var(--muted);font-size:14px}
.notice{padding:14px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-sizing:border-box;z-index:20}
@media (prefers-reduced-motion:no-preference){.verdict{transition:background .15s}}

.view{display:flex;flex-direction:column;gap:14px;width:100%}
.count small{white-space:nowrap}
.tabs{grid-template-columns:repeat(3,1fr)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price .amt{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;background:linear-gradient(90deg,var(--accent),var(--sea));-webkit-background-clip:text;background-clip:text;color:transparent}
.price .lbl{font-weight:600;color:var(--muted)}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.code{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.code .qr{background:#ffffff;border-radius:12px;padding:14px;width:100%;max-width:280px;box-sizing:border-box}
.code img{display:block;width:100%;height:auto;image-rendering:auto}
.code .app{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.code .handle{font-weight:600;color:var(--muted);user-select:all}
.payhint{margin:0;font-size:14px;color:var(--muted)}
.paylink{margin-top:4px}
</style>
</head>

const $ = id => document.getElementById(id);
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
GUESTS.forEach(g => { g.key = norm(g.name); });
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n]; }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function findMatches(q){
  const qt = norm(q).split(" ").filter(Boolean);
  const exact = [], related = [], close = [];
  if(!qt.length) return {exact, related, close};
  const pre = nt => qt.every(t => nt.some(w => w.startsWith(t)));
  for(const g of GUESTS){
    const nt = g.key.split(" ");
    if(pre(nt)) { exact.push(g); continue; }
    const pt = norm(g.plusOf).split(" ").filter(Boolean);
    if(pt.length && pre(pt)) { related.push(g); continue; }
    const ok = qt.every(t => nt.some(w => { const tol = t.length <= 4 ? 1 : 2;
      return lev(t, w.slice(0, Math.max(t.length, Math.min(w.length, t.length + 1)))) <= tol || lev(t,w) <= tol; }));
    if(ok && qt.join("").length >= 3) close.push(g);
  }
  const full = norm(q);
  exact.sort((a,b)=> (b.key===full) - (a.key===full) || a.name.localeCompare(b.name));
  close.sort((a,b)=> a.name.localeCompare(b.name));
  return {exact, related, close};
}
const PAY = { paid:["Paid","in"], free:["Free entry","in"], partial:["Partly paid","warn"], confirm:["Confirm payment","warn"], unpaid:["Not paid","warn"] };

function guestRow(g){
  const row = el("div","row"), who = el("div","who");
  who.append(el("div","name",g.name));
  const chips = el("div","chips"), p = PAY[g.payment] || PAY.unpaid;
  chips.append(el("span","chip " + p[1], p[0]));
  if(g.status && g.status !== "Going") chips.append(el("span","chip out", g.status === "Maybe" ? "RSVP: Maybe" : g.status));
  if(g.plusOf) chips.append(el("span","chip out","+1 of " + g.plusOf));
  who.append(chips);
  if(g.note) who.append(el("div","note", g.note));
  row.append(who);
  return row;
}

function renderDoor(){
  const q = $("q").value, v = $("verdict"), res = $("results");
  $("clearQ").hidden = !q;
  res.replaceChildren(); res.hidden = true;
  const set = (cls, big, sub, pay) => { v.className = "verdict " + cls; v.replaceChildren(el("span","big",big), el("span","sub",sub));
    if(pay){ const b = el("button","btn primary paylink","Show $8 pay codes"); b.onclick = () => show("pay"); v.append(b); } };
  if(norm(q).length < 2){ set("idle","Ready","Type a first or last name. Partial names work."); return; }
  const {exact, related, close} = findMatches(q);
  if(exact.length){
    const g = exact[0];
    const rsvp = g.status === "Maybe" ? " RSVP was Maybe." : g.status === "No RSVP" ? " Never RSVPed." : "";
    if(exact.length > 1) set("yes","On the list", exact.length + " people match. Confirm the full name.");
    else if(g.payment === "paid") set("yes","Paid · Let in", g.name + "." + rsvp);
    else if(g.payment === "free") set("yes","Let in", g.name + ". No payment needed." + rsvp);
    else if(g.payment === "partial") set("maybe","Partly paid", g.name + ". " + (g.note || "Collect the rest.") + rsvp, true);
    else if(g.payment === "confirm") set("maybe","Confirm payment", g.name + " RSVPed but isn't on the paid list yet. Check their Venmo or Cash App receipt, or collect $8." + rsvp, true);
    else set("maybe","Not paid", g.name + " is on the list but hasn't paid. Collect $8." + rsvp, true);
    [...exact.slice(0,30), ...related.slice(0,10)].forEach(x => res.append(guestRow(x))); res.hidden = false;
  } else if(related.length){
    set("maybe","Plus-one","Listed as a guest of someone. Confirm who they came with.");
    related.slice(0,10).forEach(g => res.append(guestRow(g))); res.hidden = false;
  } else if(close.length){
    set("maybe","Close match","Not an exact match. Check the spelling against their ID.");
    close.slice(0,10).forEach(g => res.append(guestRow(g))); res.hidden = false;
  } else {
    set("no","Not on the list","No RSVP under “" + q.trim() + "”. Try their last name, or they can pay $8 at the door.", true);
  }
}

const SORTED = [...GUESTS].sort((a,b)=>a.name.localeCompare(b.name));
function renderList(){
  const f = norm($("f").value), box = $("allList");
  const shown = f ? SORTED.filter(g => (g.key + " " + norm(g.plusOf)).includes(f)) : SORTED;
  $("listCount").textContent = shown.length + (f ? " of " + SORTED.length : "") + " names";
  box.replaceChildren();
  if(!shown.length){ box.append(el("div","row muted","No names match that filter.")); return; }
  shown.forEach(g => box.append(guestRow(g)));
}

let qT;
$("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(renderDoor, 60); });
$("q").addEventListener("focus", e => e.target.select());
$("clearQ").onclick = () => { $("q").value = ""; renderDoor(); $("q").focus(); };
let fT;
$("f").addEventListener("input", () => { clearTimeout(fT); fT = setTimeout(renderList, 80); });

function show(view){
  const views = { door: "Door", list: "List", pay: "Pay" };
  if(!views[view]) view = "door";
  for(const k in views){ $("view" + views[k]).hidden = k !== view; $("tab" + views[k]).setAttribute("aria-selected", k === view); }
  if(view === "door") setTimeout(()=>$("q").focus(), 0);
  window.scrollTo(0, 0);
}
$("tabDoor").onclick = () => show("door");
$("tabList").onclick = () => show("list");
$("tabPay").onclick = () => show("pay");

async function wake(){ try{ if(navigator.wakeLock && document.visibilityState==="visible") await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", wake); wake();

$("countAll").textContent = GUESTS.length;
renderList();
show((location.hash || "").slice(1));
